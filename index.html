<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f7f6ff">
<title>카드로 이해하는 나의 흥미와 적성</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#f7f7fc;--card:#fff;--text:#26263a;--sub:#747489;
  --primary:#6c63ff;--shadow:0 18px 45px rgba(34,34,70,.10);
  --things:#eb9d45;--people:#e96c87;--data:#548bcf;--ideas:#866bce;
}
html,body{margin:0;min-height:100%}
body{
  font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  background:
    radial-gradient(circle at top left,#efedff 0,transparent 28%),
    radial-gradient(circle at top right,#ffeef2 0,transparent 25%),
    var(--bg);
  color:var(--text);-webkit-tap-highlight-color:transparent
}
button{font-family:inherit;touch-action:manipulation}
img{user-select:none;-webkit-user-drag:none}
.screen{display:none;min-height:100vh}
.screen.active{display:flex}
.container{width:min(1050px,calc(100% - 32px));margin:auto}
.small{font-size:14px;line-height:1.72;color:var(--sub)}
.logo-mark{
  width:50px;height:50px;border-radius:16px;
  background:linear-gradient(135deg,#786fff,#ff83a1);
  display:grid;place-items:center;color:white;font-weight:900;font-size:21px;
  box-shadow:0 10px 22px rgba(108,99,255,.25)
}

/* home */
#homeScreen{align-items:center;justify-content:center;padding:50px 0}
.home-panel{
  background:rgba(255,255,255,.94);box-shadow:var(--shadow);
  border-radius:34px;padding:54px 48px;text-align:center
}
.home-logo{margin:0 auto 24px}
.home-panel h1{font-size:clamp(30px,5vw,49px);letter-spacing:-2px;margin:0 0 18px}
.home-panel h1 span{color:var(--primary)}
.home-description{max-width:760px;margin:0 auto 32px;line-height:1.85;color:#727286}
.dimension-mini{max-width:650px;margin:28px auto;display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.dimension-mini>div{background:#f6f6fb;border-radius:14px;padding:12px 6px;font-size:12px}
.dimension-mini b{display:block;font-size:14px;margin-bottom:3px}
.home-buttons{max-width:680px;margin:34px auto 0;display:grid;grid-template-columns:1fr 1fr;gap:18px}
.start-btn{border:none;border-radius:22px;padding:24px 20px;font-size:20px;font-weight:800;cursor:pointer}
.start-btn.interest{background:#fff0f4;color:#d94e71}
.start-btn.aptitude{background:#eef5ff;color:#3973c6}
.start-btn .icon{display:block;font-size:31px;margin-bottom:8px}
.previous-results{margin-top:25px}
.previous-results button{border:none;background:transparent;color:var(--primary);font-weight:800;cursor:pointer;margin:4px}

/* test */
#testScreen{flex-direction:column}
.test-header{background:rgba(255,255,255,.92);border-bottom:1px solid #ededf3}
.test-header-inner{width:min(900px,calc(100% - 30px));height:76px;margin:auto;display:flex;justify-content:space-between;align-items:center}
.test-title{display:flex;gap:12px;align-items:center}
.test-title-badge{background:#eceaff;color:var(--primary);padding:7px 12px;border-radius:30px;font-size:13px;font-weight:800}
.exit-btn{border:none;background:#f1f1f7;padding:9px 13px;border-radius:12px;cursor:pointer}
.progress-area{width:min(900px,calc(100% - 30px));margin:19px auto 0}
.progress-info{display:flex;justify-content:space-between;margin-bottom:8px;font-size:13px}
.progress-track{height:8px;background:#e7e7ee;border-radius:50px;overflow:hidden}
.progress-bar{height:100%;width:0;background:linear-gradient(90deg,#6c63ff,#918cff);transition:width .3s}
.test-body{width:min(900px,calc(100% - 30px));margin:auto;padding:22px 0 30px;display:flex;flex-direction:column;align-items:center}
.instruction{text-align:center;color:var(--sub)}
.game-card-wrap{width:min(385px,100%)}
.game-card{background:white;border-radius:25px;overflow:hidden;box-shadow:0 22px 50px rgba(35,35,70,.13);transition:.2s}
.game-card.card-out{transform:translateX(-32px) rotate(-2deg);opacity:0}
.card-image-box{position:relative;aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;background:#fafafd}
.card-image-box img{width:100%;height:100%;object-fit:contain}
.card-loading{position:absolute;inset:0;z-index:10;background:rgba(250,250,253,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;font-weight:800;color:#777}
.loading-spinner{width:38px;height:38px;border:4px solid #e3e2f0;border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.image-error{display:none;padding:30px;text-align:center;color:#999;line-height:1.7}
.card-bottom{padding:15px 18px;display:flex;justify-content:space-between}
.card-number{color:#aaa;font-size:12px}.card-name{font-size:17px;font-weight:900}
.choice-buttons{width:min(590px,100%);display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:20px}
.choice-btn{border:none;border-radius:17px;min-height:62px;font-size:16px;font-weight:800;cursor:pointer}
.choice-btn.good{background:#eaf8f2;color:#328766}.choice-btn.normal{background:#fff6e7;color:#d4871c}.choice-btn.bad{background:#fff0f0;color:#d95757}
.choice-btn:disabled{opacity:.35;pointer-events:none}
.keyboard-help{margin-top:13px;color:#aaa;font-size:11px}

/* selection */
#selectionScreen{align-items:flex-start;padding:35px 0 60px}
.selection-panel{width:100%;background:white;border-radius:30px;box-shadow:var(--shadow);padding:35px}
.selection-header{text-align:center;margin-bottom:28px}
.selection-counter{display:inline-block;margin-top:15px;background:#eceaff;color:var(--primary);border-radius:30px;padding:9px 17px;font-weight:900}
.selected-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.mini-card{position:relative;border-radius:17px;overflow:hidden;background:white;box-shadow:0 7px 20px rgba(30,30,60,.08);cursor:pointer;border:2px solid transparent}
.mini-card img{width:100%;aspect-ratio:3/4;object-fit:contain}
.mini-card-title{padding:8px;text-align:center;font-size:12px;font-weight:800}
.remove-label{position:absolute;right:7px;top:7px;width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:rgba(30,30,40,.72);color:white}
.added-badge{position:absolute;left:7px;top:7px;background:#ffb84d;color:white;padding:5px 7px;border-radius:8px;font-size:9px;font-weight:800}
.selection-actions,.result-actions{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-top:30px}
.primary-btn,.secondary-btn{border:none;border-radius:16px;padding:15px 25px;font-size:15px;font-weight:800;cursor:pointer}
.primary-btn{background:var(--primary);color:white}.primary-btn:disabled{opacity:.35;cursor:default}.secondary-btn{background:#eeeef5}

/* analysis */
#analysisScreen{justify-content:center;align-items:center}
.analysis-box{width:min(500px,calc(100% - 30px));background:white;border-radius:32px;padding:55px 30px;text-align:center;box-shadow:var(--shadow)}
.analysis-icon{font-size:65px;animation:pulse 1s infinite alternate}
@keyframes pulse{from{transform:scale(.9)}to{transform:scale(1.1)}}
.analysis-progress{height:8px;margin-top:25px;background:#ededf4;border-radius:50px;overflow:hidden}
.analysis-progress div{height:100%;width:0;background:linear-gradient(90deg,#6c63ff,#ff7c9b);transition:width .5s}

/* result */
#resultScreen{align-items:flex-start;padding:35px 0 70px}
.result-page{width:min(1000px,calc(100% - 30px));margin:auto}
.result-top{background:linear-gradient(135deg,#6e67e9,#8a7cee);color:white;padding:38px;border-radius:30px}
.result-top h1{margin:8px 0 12px;font-size:clamp(29px,5vw,45px);letter-spacing:-1.2px}
.result-top p{line-height:1.78}
.result-kicker{display:inline-block;padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.16);font-weight:800;font-size:13px}
.result-quote{margin-top:15px;padding:14px 16px;border-radius:18px;background:rgba(255,255,255,.13);font-weight:800}
.result-section{background:white;margin-top:20px;border-radius:24px;padding:30px;box-shadow:0 12px 30px rgba(40,40,80,.07)}
.result-section h2{margin-top:0}
.domain-bars{display:flex;flex-direction:column;gap:14px}
.domain-row{display:grid;grid-template-columns:100px 1fr 50px;gap:12px;align-items:center}
.domain-track{height:13px;background:#ededf3;border-radius:40px;overflow:hidden}
.domain-value{height:100%;border-radius:inherit}
.result-grid-two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.result-grid-three{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.info-card{background:#f8f8fc;border-radius:18px;padding:22px}
.info-card h3{margin-top:0}
.info-card p{line-height:1.78;color:#626277;margin-bottom:0}
.evidence-card{border:1px solid #ececf4;background:#fcfcff}
.evidence-chip-wrap,.tag-wrap{display:flex;flex-wrap:wrap;gap:8px}
.evidence-chip,.tag{padding:9px 12px;border-radius:30px;background:#f1f0ff;color:#5e56c7;font-size:13px;font-weight:700}
.theme-card{border:1px solid #ececf4;background:#fff;border-radius:18px;padding:20px}
.theme-score{font-size:12px;color:#858598;margin-bottom:8px}
.theme-card h3{margin:0 0 8px}
.theme-card p{margin:0;color:#67677b;line-height:1.72;font-size:14px}
.career-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.career-card{background:#f8f8fc;border-radius:18px;padding:18px}
.career-card h3{margin:0 0 8px}
.career-card p{font-size:13px;line-height:1.65;color:#6e6e82;margin:0 0 12px}
.reflection-box{background:linear-gradient(135deg,#fff8e8,#f8f3ff);border-radius:20px;padding:22px}
.reflection-box ol{margin:0;padding-left:22px;line-height:1.9}
.domain-card-section{margin-top:18px;padding:20px;border-radius:20px;background:#fafafd}
.domain-card-header{display:flex;justify-content:space-between;margin-bottom:15px}
.domain-card-title{font-weight:900;font-size:18px}
.domain-card-count{color:white;padding:6px 11px;border-radius:20px;font-size:12px;font-weight:900}
.grouped-card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:12px}
.final-card{position:relative;background:white;border-radius:15px;padding:7px}
.final-card img{width:100%;aspect-ratio:3/4;object-fit:contain}
.card-domain-badge{position:absolute;top:12px;left:12px;color:white;padding:5px 8px;border-radius:20px;font-size:10px;font-weight:900}
.final-card-title{display:block;text-align:center;font-size:11px;font-weight:800;padding:7px}
.notice{border-left:4px solid #c8c5ff;padding-left:14px}
.toast{position:fixed;bottom:25px;left:50%;transform:translate(-50%,30px);opacity:0;background:rgba(30,30,40,.92);color:white;padding:12px 20px;border-radius:30px;transition:.3s;z-index:1000}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:760px){
  .home-panel{padding:35px 20px}.home-buttons{grid-template-columns:1fr}.dimension-mini{grid-template-columns:repeat(2,1fr)}
  .game-card-wrap{width:min(310px,82vw)}.choice-buttons{position:sticky;bottom:8px;background:rgba(247,247,252,.92);padding:7px;border-radius:20px}
  .selected-grid{grid-template-columns:repeat(3,1fr)}.result-grid-two,.result-grid-three,.career-grid{grid-template-columns:1fr}
  .grouped-card-grid{grid-template-columns:repeat(3,1fr)}.result-section{padding:22px 18px}
}
</style>
</head>
<body>

<section id="homeScreen" class="screen active">
<div class="container">
<div class="home-panel">
  <div class="logo-mark home-logo">P</div>
  <h1>카드로 이해하는<br>나의 <span>흥미와 적성</span></h1>
  <div class="home-description">
    52장의 활동 카드를 통해 내가 좋아하는 활동과 잘한다고 느끼는 활동을 찾아봅니다.<br><br>
    활동은 <b>사물 · 사람 · 자료 · 아이디어</b> 네 영역으로 살펴봅니다.
  </div>
  <div class="dimension-mini">
    <div><b>🔧 사물</b>만들고 다루기</div>
    <div><b>🤝 사람</b>소통하고 돕기</div>
    <div><b>📊 자료</b>분석하고 정리하기</div>
    <div><b>💡 아이디어</b>생각하고 창조하기</div>
  </div>
  <div class="home-buttons">
    <button class="start-btn interest" onclick="startTest('interest')"><span class="icon">❤️</span>흥미 검사<div class="small">내가 좋아하는 활동 찾기</div></button>
    <button class="start-btn aptitude" onclick="startTest('aptitude')"><span class="icon">⭐</span>적성 검사<div class="small">내가 잘한다고 느끼는 활동 찾기</div></button>
  </div>
  <div id="previousResults" class="previous-results"></div>
</div>
</div>
</section>

<section id="testScreen" class="screen">
<header class="test-header">
  <div class="test-header-inner">
    <div class="test-title"><div id="testBadge" class="test-title-badge"></div><strong>카드로 이해하는 나</strong></div>
    <button class="exit-btn" onclick="confirmExit()">나가기</button>
  </div>
</header>
<div class="progress-area">
  <div class="progress-info"><span>카드 진행</span><b id="progressText">1 / 52</b></div>
  <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
</div>
<main class="test-body">
  <p id="questionGuide" class="instruction"></p>
  <div class="game-card-wrap">
    <div id="gameCard" class="game-card">
      <div class="card-image-box">
        <img id="cardImage" src="" alt="활동 카드">
        <div id="cardLoading" class="card-loading"><div class="loading-spinner"></div>카드 불러오는 중...</div>
        <div id="imageError" class="image-error"></div>
      </div>
      <div class="card-bottom"><span id="cardNumber" class="card-number"></span><span id="cardName" class="card-name"></span></div>
    </div>
  </div>
  <div class="choice-buttons">
    <button id="positiveButton" class="choice-btn good" onclick="answerCard('positive')"></button>
    <button id="neutralButton" class="choice-btn normal" onclick="answerCard('neutral')">😐 보통</button>
    <button id="negativeButton" class="choice-btn bad" onclick="answerCard('negative')"></button>
  </div>
  <div class="keyboard-help">← 긍정 / ↓ 보통 / → 부정</div>
</main>
</section>

<section id="selectionScreen" class="screen">
<div class="container">
<div class="selection-panel">
  <div class="selection-header">
    <h2 id="selectionTitle"></h2>
    <p id="selectionDescription"></p>
    <div id="selectionCounter" class="selection-counter"></div>
  </div>
  <div id="selectedGrid" class="selected-grid"></div>
  <div class="selection-actions">
    <button class="secondary-btn" onclick="restartCurrentTest()">처음부터 다시</button>
    <button id="analyzeButton" class="primary-btn" onclick="beginAnalysis()">분석하기</button>
  </div>
</div>
</div>
</section>

<section id="analysisScreen" class="screen">
<div class="analysis-box">
  <div class="analysis-icon">🃏</div>
  <h2>카드 분석중...</h2>
  <p id="analysisMessage" class="small"></p>
  <div class="analysis-progress"><div id="analysisProgressBar"></div></div>
</div>
</section>

<section id="resultScreen" class="screen">
<main id="resultPage" class="result-page"></main>
</section>
<div id="toast" class="toast"></div>

<script>
const cardNames = [
"조립","유지보수","도구이용","관리경작","수집","운용작동","제작","운송수송","구매구입","물류이동","현장관리","건축건설","과학기술실험",
"고객응대서비스","공동작업","판매영업","교제네트워킹","조율조화","통솔지지","상담코칭","팀웍격려","훈련육성","교육","사회복지봉사","협상","마찰해결중재",
"회계","예산책정","판독조사","편집","분류정리","분석","요약통계","검토","단서수집탐색","기록","설계도안","연구","판정",
"변론변호","설명해석","글쓰기","유추","문제해결","개념화","홍보마케팅","프리젠테이션","전략개발","개혁개척","관계결합창의","아이디어포착","발명"
];

function getDomain(id){
  if(id<=13) return "things";
  if(id<=26) return "people";
  if(id<=39) return "data";
  return "ideas";
}

const allCards = cardNames.map((name,index)=>{
  const id=index+1, number=String(id).padStart(2,"0");
  return {id,number,name,domain:getDomain(id),file:`${number}. ${name}.png`};
});

const domainInfo = {
  things:{
    korean:"사물",english:"THINGS",icon:"🔧",color:"#eb9d45",
    interestDescription:"직접 만들고 조작하고 움직이며 눈에 보이는 결과를 만들어내는 활동에 관심을 느끼는 경향이 있습니다.",
    aptitudeDescription:"직접 조작하고 시험하며 실제 문제를 해결하는 과정에서 강점을 느끼는 경향이 있습니다.",
    shine:"설명만 듣기보다 직접 해보고 결과를 확인할 때 몰입하기 쉽습니다.",
    friction:"추상적인 설명만 길게 이어지고 실제로 해볼 기회가 없으면 답답하게 느낄 수 있습니다."
  },
  people:{
    korean:"사람",english:"PEOPLE",icon:"🤝",color:"#e96c87",
    interestDescription:"사람과 관계를 맺고 대화하거나 돕고 협력하는 활동에 관심을 느끼는 경향이 있습니다.",
    aptitudeDescription:"다른 사람과 의견을 나누고 관계를 조율하며 함께 목표를 달성하는 상황에서 강점을 느끼는 경향이 있습니다.",
    shine:"혼자보다 사람들과 의견을 주고받고 함께 움직일 때 에너지가 올라가기 쉽습니다.",
    friction:"대화나 협력이 거의 없이 혼자 오래 처리해야 하는 상황은 지루하게 느껴질 수 있습니다."
  },
  data:{
    korean:"자료",english:"DATA",icon:"📊",color:"#548bcf",
    interestDescription:"정보를 수집하고 분류하며 비교·분석하고 정확하게 확인하는 활동에 관심을 느끼는 경향이 있습니다.",
    aptitudeDescription:"자료를 정확하게 확인하고 구조화하며 기준을 사용해 분석하고 판단하는 활동에서 강점을 느끼는 경향이 있습니다.",
    shine:"근거와 기준이 있고 자료를 정리·비교할 수 있는 상황에서 집중하기 쉽습니다.",
    friction:"근거 없이 '그냥 느낌대로' 결정해야 하거나 기준이 계속 바뀌면 답답하게 느낄 수 있습니다."
  },
  ideas:{
    korean:"아이디어",english:"IDEAS",icon:"💡",color:"#866bce",
    interestDescription:"새로운 아이디어를 떠올리고 문제를 다른 관점에서 해석하며 새로운 해결책을 만드는 활동에 관심을 느끼는 경향이 있습니다.",
    aptitudeDescription:"새로운 개념을 이해하고 복잡한 문제를 해결하거나 새로운 방법을 생각하는 과정에서 강점을 느끼는 경향이 있습니다.",
    shine:"정답이 하나로 정해지지 않은 문제에서 스스로 방법을 만들 때 몰입하기 쉽습니다.",
    friction:"방법과 답이 지나치게 고정되어 있고 새로운 시도를 할 여지가 없으면 답답하게 느낄 수 있습니다."
  }

Object.values(cardInsights).forEach(v=>{

let currentTest=null;
let shuffledCards=[];
let currentIndex=0;
let answers={positive:[],neutral:[],negative:[]};
let selectionPool=[];
let selectedFinalCards=[];
let cardLocked=true;
let imageLoadToken=0;

function showScreen(id){
  document.querySelectorAll(".screen").forEach(el=>el.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  window.scrollTo(0,0);
}
function shuffle(array){
  const copy=[...array];
  for(let i=copy.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [copy[i],copy[j]]=[copy[j],copy[i]];
  }
  return copy;
}
function toast(message){
  const el=document.getElementById("toast");
  el.textContent=message;el.classList.add("show");
  setTimeout(()=>el.classList.remove("show"),1800);
}
function setChoiceButtonsEnabled(enabled){
  ["positiveButton","neutralButton","negativeButton"].forEach(id=>document.getElementById(id).disabled=!enabled);
  cardLocked=!enabled;
}

function startTest(type){
  currentTest=type;shuffledCards=shuffle(allCards);currentIndex=0;
  answers={positive:[],neutral:[],negative:[]};selectionPool=[];selectedFinalCards=[];
  setChoiceButtonsEnabled(false);

  if(type==="interest"){
    testBadge.textContent="❤️ 흥미 검사";
    questionGuide.innerHTML=`이 활동을 내가 <strong>얼마나 좋아하는지</strong> 생각해 보세요.`;
    positiveButton.textContent="❤️ 좋아함";negativeButton.textContent="🙅 싫어함";
  }else{
    testBadge.textContent="⭐ 적성 검사";
    questionGuide.innerHTML=`이 활동을 내가 <strong>얼마나 잘한다고 느끼는지</strong> 생각해 보세요.`;
    positiveButton.textContent="⭐ 잘함";negativeButton.textContent="😅 잘못함";
  }
  showScreen("testScreen");renderCard();
}

function renderCard(){
  if(currentIndex>=52){finishCardQuestions();return;}
  setChoiceButtonsEnabled(false);
  const card=shuffledCards[currentIndex];
  cardNumber.textContent=`${card.number} / 52`;cardName.textContent=card.name;
  imageLoadToken++;const token=imageLoadToken;
  cardLoading.style.display="flex";imageError.style.display="none";cardImage.style.display="block";
  cardImage.onload=()=>{
    if(token!==imageLoadToken)return;
    cardLoading.style.display="none";setChoiceButtonsEnabled(true);preloadNextCard();
  };
  cardImage.onerror=()=>{
    if(token!==imageLoadToken)return;
    cardLoading.style.display="none";cardImage.style.display="none";imageError.style.display="block";
    imageError.innerHTML=`<b>${card.number}. ${card.name}</b><br><br>카드 이미지를 찾지 못했습니다.<br>${card.file}`;
    setChoiceButtonsEnabled(true);
  };
  cardImage.src="cards/"+card.file;
  progressBar.style.width=`${currentIndex/52*100}%`;progressText.textContent=`${currentIndex+1} / 52`;
}
function preloadNextCard(){
  if(currentIndex+1>=52)return;
  const img=new Image();img.src="cards/"+shuffledCards[currentIndex+1].file;
}
function answerCard(answer){
  if(cardLocked)return;
  setChoiceButtonsEnabled(false);
  answers[answer].push(shuffledCards[currentIndex]);
  gameCard.classList.add("card-out");
  setTimeout(()=>{currentIndex++;gameCard.classList.remove("card-out");renderCard();},200);
}

function finishCardQuestions(){
  selectionPool=answers.positive.map(card=>({...card,addedFromNeutral:false}));
  if(selectionPool.length<9){
    const need=9-selectionPool.length;
    const neutral=shuffle(answers.neutral).slice(0,need).map(card=>({...card,addedFromNeutral:true}));
    selectionPool.push(...neutral);
  }
  if(selectionPool.length<9){
    alert("긍정 선택과 보통 카드가 합쳐도 9장이 되지 않습니다.");restartCurrentTest();return;
  }
  selectedFinalCards=[...selectionPool];
  showSelectionScreen();
}
function showSelectionScreen(){
  showScreen("selectionScreen");
  selectionTitle.textContent=currentTest==="interest"?"내가 좋아하는 핵심 활동":"내가 잘한다고 느끼는 핵심 활동";
  if(selectionPool.length>9){
    selectionDescription.innerHTML=`선택한 카드가 <b>9장을 초과했습니다.</b><br>상대적으로 덜 중요한 카드를 눌러 제외해주세요.<br>제외한 카드는 마음이 바뀌면 다시 선택할 수 있습니다.`;
  }else{
    selectionDescription.innerHTML=`최종 선택된 <b>9장의 핵심 카드</b>를 확인해주세요.`;
  }
  renderSelectionCards();
}
function renderSelectionCards(){
  selectedGrid.innerHTML="";
  selectionPool.forEach(card=>{
    const selected=selectedFinalCards.some(x=>x.id===card.id);
    const div=document.createElement("div");div.className="mini-card";
    if(!selected){div.style.opacity=".32";div.style.filter="grayscale(1)";}
    div.innerHTML=`
      ${card.addedFromNeutral?`<div class="added-badge">보통에서 보충</div>`:""}
      ${selected&&selectionPool.length>9?`<div class="remove-label">×</div>`:""}
      <img src="cards/${card.file}">
      <div class="mini-card-title">${card.name}</div>`;
    if(selectionPool.length>9)div.onclick=()=>toggleFinalCard(card.id);
    selectedGrid.appendChild(div);
  });
  const count=selectedFinalCards.length;
  selectionCounter.textContent=`${count} / 9`;
  analyzeButton.disabled=count!==9;
  analyzeButton.textContent=count>9?`${count-9}장 더 제외시키세요`:count<9?`${9-count}장 더 선택하세요`:"분석하기";
}
function toggleFinalCard(id){
  const exists=selectedFinalCards.some(card=>card.id===id);
  if(exists)selectedFinalCards=selectedFinalCards.filter(card=>card.id!==id);
  else{
    const card=selectionPool.find(card=>card.id===id);
    if(card)selectedFinalCards.push(card);
  }
  renderSelectionCards();
}

function beginAnalysis(){
  if(selectedFinalCards.length!==9){toast("카드를 정확히 9장 선택해주세요.");return;}
  showScreen("analysisScreen");
  const messages=[
    "선택한 카드의 공통점을 찾고 있어요.",
    "사물·사람·자료·아이디어 분포를 확인하고 있어요.",
    "실제 선택한 활동에서 진로 키워드를 찾고 있어요.",
    "상위 영역의 조합과 동률을 분석하고 있어요.",
    "학교생활과 진로탐색에 연결하고 있어요."
  ];
  analysisProgressBar.style.width="0%";let step=0;analysisMessage.textContent=messages[0];
  const timer=setInterval(()=>{
    step++;analysisProgressBar.style.width=`${Math.min((step+1)*20,100)}%`;
    if(messages[step])analysisMessage.textContent=messages[step];
    if(step>=4)clearInterval(timer);
  },1000);
  setTimeout(calculateAndShowResult,5100);
}

function calculateScores(cards){
  const scores={things:0,people:0,data:0,ideas:0};
  cards.forEach(card=>scores[card.domain]++);
  return scores;
}

function analyzeScorePattern(scores){
  const order=["things","people","data","ideas"];
  const entries=order.map(key=>({key,score:scores[key]})).sort((a,b)=>b.score-a.score);
  const highest=entries[0].score;
  const topDomains=entries.filter(x=>x.score===highest);
  const remaining=entries.filter(x=>x.score<highest);
  let secondDomains=[];
  if(remaining.length){
    const secondScore=remaining[0].score;
    secondDomains=remaining.filter(x=>x.score===secondScore);
  }
  const lowest=entries[entries.length-1].score;
  const gap=highest-lowest;
  let patternType="",patternTitle="",patternDescription="";

  if(topDomains.length>=3){
    patternType="balanced";patternTitle="🌈 다양한 활동 선호형";
    patternDescription="여러 영역이 같은 수준으로 높게 나타났습니다. 한 가지 방식으로 나를 단정하기보다 다양한 활동에서 어떤 카드에 특히 끌렸는지 함께 보는 것이 좋습니다.";
  }else if(topDomains.length===2){
    patternType="dual";
    const names=topDomains.map(x=>domainInfo[x.key].korean).join(" + ");
    patternTitle=`🧩 ${names} 복합형`;
    patternDescription="두 영역이 같은 점수로 가장 높습니다. 어느 한쪽을 억지로 1위로 정하지 않고 두 영역을 동등한 핵심 성향으로 해석합니다.";
  }else{
    const first=entries[0],second=entries[1],firstSecondGap=first.score-second.score;
    if(firstSecondGap>=2){
      patternType="clear";patternTitle=`🎯 ${domainInfo[first.key].korean} 중심형`;
      patternDescription=`${domainInfo[first.key].korean} 영역이 비교적 뚜렷하게 높습니다. 다만 9장의 카드 안에서 나타난 상대적인 특징이므로 '고정된 유형'으로 단정하지 않습니다.`;
    }else{
      patternType="mixed";patternTitle=`🌱 ${domainInfo[first.key].korean} 중심 복합형`;
      patternDescription=`${domainInfo[first.key].korean} 영역이 가장 높지만 상위 영역과 차이가 크지 않습니다. 1위뿐 아니라 함께 높게 나온 영역과 실제 선택 카드를 같이 보는 것이 좋습니다.`;
    }
  }

  if(topDomains.length===1&&gap<=1){
    patternType="balanced";patternTitle="🌈 비교적 균형적인 성향";
    patternDescription="네 영역의 카드 수 차이가 매우 작습니다. 특정 방식 하나보다 다양한 종류의 활동에 비교적 고르게 관심이나 강점을 느끼는 결과입니다.";
  }

  return {entries,highest,topDomains,secondDomains,patternType,patternTitle,patternDescription};
}

function analyzeThemes(cards){
  const counts={};
  const evidence={};
  cards.forEach(card=>{
    const meta=cardInsights[card.name];
    if(!meta)return;
    meta.themes.forEach(theme=>{
      counts[theme]=(counts[theme]||0)+1;
      if(!evidence[theme])evidence[theme]=[];
      evidence[theme].push(card.name);
    });
  });
  return Object.entries(counts)
    .map(([key,score])=>({key,score,cards:[...new Set(evidence[key])]}))
    .sort((a,b)=>b.score-a.score || a.key.localeCompare(b.key));
}

function getNarrativeProfile(pattern){
  if(pattern.patternType==="balanced") return balancedProfile;
  if(pattern.topDomains.length===2){
    const key=pattern.topDomains.map(x=>x.key).sort().join("-");
    return pairProfiles[key]||balancedProfile;
  }
  const first=pattern.entries[0].key;
  if(pattern.entries[1] && pattern.entries[0].score-pattern.entries[1].score<=1){
    const key=[pattern.entries[0].key,pattern.entries[1].key].sort().join("-");
    return pairProfiles[key]||singleProfiles[first];
  }
  return singleProfiles[first];
}

function makeEvidenceSentence(cards,type){
  const words=cards.slice(0,5).map(c=>`<b>${c.name}</b>`).join(" · ");
  return type==="interest"
    ? `특히 ${words} 같은 활동을 최종 카드로 남겼습니다. 결과는 이 실제 선택을 근거로 해석합니다.`
    : `특히 ${words} 같은 활동을 '내가 잘한다고 느끼는 활동'으로 최종 선택했습니다. 결과는 이 자기인식을 근거로 해석합니다.`;
}

function getTopDomainSet(pattern){
  const result=[...pattern.topDomains];
  if(pattern.topDomains.length===1 && pattern.secondDomains.length) result.push(...pattern.secondDomains);
  return result.slice(0,3);
}

function makeDomainInterpretation(domains,isInterest){
  return domains.map((item,index)=>{
    const d=domainInfo[item.key];
    const label=index===0 && domains.length===1?"주요 영역":
      (item.score===domains[0].score?"공동 주요 영역":"함께 나타난 영역");
    return `<div class="info-card">
      <h3>${d.icon} ${d.korean} · ${item.score}장</h3>
      <p><b>${label}</b><br><br>${isInterest?d.interestDescription:d.aptitudeDescription}</p>
    </div>`;
  }).join("");
}

function makeThemeSection(themeRanking){
  const top=themeRanking.slice(0,3);
  if(!top.length)return "";
  return `<section class="result-section">
    <h2>🧭 네 카드에서 발견한 진로 키워드</h2>
    <p class="small">4영역 점수만으로 직업을 정하지 않고, 실제로 선택한 카드들이 반복해서 가리키는 세부 활동을 함께 봅니다.</p>
    <div class="result-grid-three">
      ${top.map((t,i)=>{
        const p=themeProfiles[t.key];
        return `<div class="theme-card">
          <div class="theme-score">${i===0?"가장 자주 연결됨":"함께 연결됨"} · ${t.score}회</div>
          <h3>${p.icon} ${p.label}</h3>
          <p>${p.description}</p>
          <div class="evidence-chip-wrap" style="margin-top:12px">
            ${t.cards.slice(0,4).map(c=>`<span class="evidence-chip">${c}</span>`).join("")}
          </div>
        </div>`;
      }).join("")}
    </div>
  </section>`;
}

function makeCareerRecommendations(themeRanking){
  const top=themeRanking.slice(0,3);
  const majorMap=new Map(),jobMap=new Map();

  top.forEach((t,index)=>{
    const p=themeProfiles[t.key];
    const weight=3-index;
    p.majors.forEach(name=>majorMap.set(name,(majorMap.get(name)||0)+weight));
    p.jobs.forEach(name=>jobMap.set(name,(jobMap.get(name)||0)+weight));
  });

  const majors=[...majorMap.entries()].sort((a,b)=>b[1]-a[1]).slice(0,10).map(x=>x[0]);
  const jobs=[...jobMap.entries()].sort((a,b)=>b[1]-a[1]).slice(0,10).map(x=>x[0]);

  return `<section class="result-section">
    <h2>🎓 그래서 어떤 분야를 탐색해볼까?</h2>
    <p class="small">아래는 '이 직업이 정답'이라는 뜻이 아니라, 네가 고른 활동과 비슷한 일이 많이 포함된 분야를 탐색해보라는 제안입니다.</p>
    <div class="career-grid">
      <div class="career-card">
        <h3>탐색해볼 학과</h3>
        <p>상위 진로 키워드를 조합해 넓은 전공 영역부터 살펴봅니다.</p>
        <div class="tag-wrap">${majors.map(x=>`<span class="tag">${x}</span>`).join("")}</div>
      </div>
      <div class="career-card">
        <h3>탐색해볼 직업</h3>
        <p>직업명보다 '그 직업에서 어떤 활동을 하는지'를 함께 확인해보세요.</p>
        <div class="tag-wrap">${jobs.map(x=>`<span class="tag">${x}</span>`).join("")}</div>
      </div>
    </div>
  </section>`;
}

function calculateAndShowResult(){
  const scores=calculateScores(selectedFinalCards);
  const pattern=analyzeScorePattern(scores);
  const themeRanking=analyzeThemes(selectedFinalCards);
  const result={type:currentTest,cards:selectedFinalCards,scores,themeRanking,date:new Date().toISOString()};
  localStorage.setItem(currentTest==="interest"?"predigerInterestResult":"predigerAptitudeResult",JSON.stringify(result));
  renderResult(result);showScreen("resultScreen");
}

function renderResult(result){
  currentTest=result.type;selectedFinalCards=result.cards;
  const scores=result.scores;
  const pattern=analyzeScorePattern(scores);
  const themeRanking=result.themeRanking&&result.themeRanking.length?result.themeRanking:analyzeThemes(result.cards);
  const isInterest=result.type==="interest";
  const topDomains=getTopDomainSet(pattern);
  const profile=getNarrativeProfile(pattern);
  const topCardEvidence=[...result.cards]
    .sort((a,b)=>{
      const sa=pattern.entries.find(x=>x.key===a.domain)?.score||0;
      const sb=pattern.entries.find(x=>x.key===b.domain)?.score||0;
      return sb-sa;
    });

  resultPage.innerHTML=`
    <section class="result-top">
      <span class="result-kicker">${isInterest?"❤️ 흥미 검사 결과":"⭐ 적성 검사 결과"}</span>
      <h1>${profile.emoji} ${profile.title}</h1>
      <p>${pattern.patternTitle}<br><br>${profile.summary||pattern.patternDescription}</p>
      <div class="result-quote">“${profile.quote}”</div>
    </section>

    <section class="result-section">
      <h2>📊 나의 4영역 분포</h2>
      <div class="domain-bars">
        ${makeDomainBar("things",scores.things)}
        ${makeDomainBar("people",scores.people)}
        ${makeDomainBar("data",scores.data)}
        ${makeDomainBar("ideas",scores.ideas)}
      </div>
      <p class="small notice" style="margin-top:18px">${pattern.patternDescription}</p>
    </section>

    <section class="result-section">
      <h2>🔍 왜 이런 결과가 나왔을까?</h2>
      <div class="info-card evidence-card">
        <p>${makeEvidenceSentence(topCardEvidence,result.type)}</p>
      </div>
      <div class="result-grid-two" style="margin-top:14px">
        ${makeDomainInterpretation(topDomains,isInterest)}
      </div>
    </section>

    ${makeSchoolLifeSection(profile,topDomains,result.type)}
    ${makeThemeSection(themeRanking)}
    ${makeCareerRecommendations(themeRanking)}
    ${makeReflectionSection(result.type)}

    <section class="result-section">
      <h2>${isInterest?"❤️ 내가 선택한 흥미 카드 9장":"⭐ 내가 선택한 강점 카드 9장"}</h2>
      <p class="small">결과의 출발점은 유형명이 아니라 실제로 내가 고른 9장의 활동입니다.</p>
      ${makeGroupedCards(result.cards)}
    </section>

    <section class="result-section">
      <h2>🌱 결과를 보는 방법</h2>
      <p class="small notice">
        이 결과는 사물·사람·자료·아이디어의 활동 관점과 실제 선택 카드의 활동 특성을 이용한 교육용 자기이해 활동입니다.
        학과·직업 추천은 선택 카드와 연결되는 진로 분야를 탐색하기 위한 예시이며, 특정 학과나 직업의 적합성을 판정하는 공식 진단이 아닙니다.
        특히 1장 정도의 점수 차이는 큰 차이로 단정하지 않고 복합 성향으로 살펴보는 것이 좋습니다.
      </p>
    </section>

    <div class="result-actions">
      <button class="secondary-btn" onclick="goHome()">🏠 메인</button>
      <button class="primary-btn" onclick="restartCurrentTest()">🔄 다시 검사</button>
      <button class="primary-btn" onclick="startTest('${isInterest?"aptitude":"interest"}')">${isInterest?"⭐ 적성 검사하기":"❤️ 흥미 검사하기"}</button>
    </div>`;
}

function makeDomainBar(key,count){
  const d=domainInfo[key],width=count/9*100;
  return `<div class="domain-row">
    <div>${d.icon} <b>${d.korean}</b></div>
    <div class="domain-track"><div class="domain-value" style="width:${width}%;background:${d.color}"></div></div>
    <div><b>${count}장</b></div>
  </div>`;
}

function makeGroupedCards(cards){
  const order=["things","people","data","ideas"];
  return order.map(key=>{
    const d=domainInfo[key],list=cards.filter(card=>card.domain===key);
    return `<div class="domain-card-section" style="border-left:5px solid ${d.color}">
      <div class="domain-card-header">
        <div class="domain-card-title">${d.icon} ${d.korean}</div>
        <div class="domain-card-count" style="background:${d.color}">${list.length}장</div>
      </div>
      ${list.length?`<div class="grouped-card-grid">
        ${list.map(card=>`<div class="final-card">
          <div class="card-domain-badge" style="background:${d.color}">${d.icon} ${d.korean}</div>
          <img src="cards/${card.file}">
          <span class="final-card-title">${card.number}. ${card.name}</span>
        </div>`).join("")}
      </div>`:`<div class="small">선택한 카드가 없습니다.</div>`}
    </div>`;
  }).join("");
}

function restartCurrentTest(){if(currentTest)startTest(currentTest);else goHome();}
function confirmExit(){if(confirm("검사를 종료하고 메인으로 돌아갈까요?"))goHome();}
function goHome(){imageLoadToken++;currentTest=null;showScreen("homeScreen");updatePreviousResults();}
function updatePreviousResults(){
  let html="";
  if(localStorage.getItem("predigerInterestResult"))html+=`<button onclick="loadStoredResult('interest')">❤️ 이전 흥미 결과</button>`;
  if(localStorage.getItem("predigerAptitudeResult"))html+=`<button onclick="loadStoredResult('aptitude')">⭐ 이전 적성 결과</button>`;
  previousResults.innerHTML=html;
}
function loadStoredResult(type){
  const key=type==="interest"?"predigerInterestResult":"predigerAptitudeResult";
  const data=localStorage.getItem(key);if(!data)return;
  const result=JSON.parse(data);renderResult(result);showScreen("resultScreen");
}

document.addEventListener("keydown",event=>{
  if(!testScreen.classList.contains("active")||cardLocked)return;
  if(event.key==="ArrowLeft")answerCard("positive");
  if(event.key==="ArrowDown")answerCard("neutral");
  if(event.key==="ArrowRight")answerCard("negative");
});

setChoiceButtonsEnabled(false);
updatePreviousResults();
</script>
</body>
</html>
