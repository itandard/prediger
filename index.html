<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f7f6ff">

<title>카드로 이해하는 나의 흥미와 적성</title>

<style>
/* =========================================================
   기본 설정
========================================================= */

* {
    box-sizing: border-box;
}

:root {
    --bg: #f7f7fc;
    --card: #ffffff;
    --text: #242438;
    --sub: #77778b;

    --primary: #6c63ff;
    --primary-soft: #eceaff;

    --interest: #ff758f;
    --interest-soft: #fff0f4;

    --aptitude: #5a8dee;
    --aptitude-soft: #eef5ff;

    --good: #4caf84;
    --normal: #ffb84d;
    --bad: #f46f6f;

    --things: #eb9d45;
    --people: #e96c87;
    --data: #548bcf;
    --ideas: #866bce;

    --shadow:
        0 18px 45px rgba(34, 34, 70, 0.09);

    --radius: 24px;
}

html,
body {
    margin: 0;
    min-height: 100%;
}

body {
    font-family:
        Pretendard,
        "Noto Sans KR",
        "Apple SD Gothic Neo",
        "Malgun Gothic",
        sans-serif;

    background:
        radial-gradient(circle at top left, #efedff 0, transparent 28%),
        radial-gradient(circle at top right, #ffeef2 0, transparent 25%),
        var(--bg);

    color: var(--text);

    -webkit-tap-highlight-color: transparent;
}

button {
    font-family: inherit;
    touch-action: manipulation;
}

img {
    user-select: none;
    -webkit-user-drag: none;
}

.screen {
    display: none;
    min-height: 100vh;
}

.screen.active {
    display: flex;
}

.container {
    width: min(1040px, calc(100% - 32px));
    margin: 0 auto;
}

.small {
    font-size: 14px;
    line-height: 1.7;
    color: var(--sub);
}

.hidden {
    display: none !important;
}

.logo-mark {
    width: 48px;
    height: 48px;
    border-radius: 16px;

    background:
        linear-gradient(135deg, #786fff, #ff83a1);

    display: grid;
    place-items: center;

    color: white;
    font-weight: 900;
    font-size: 21px;

    box-shadow:
        0 10px 22px rgba(108, 99, 255, .25);
}


/* =========================================================
   메인
========================================================= */

#homeScreen {
    align-items: center;
    justify-content: center;
    padding: 50px 0;
}

.home-panel {
    background: rgba(255,255,255,.9);
    border: 1px solid rgba(255,255,255,.85);

    box-shadow: var(--shadow);
    border-radius: 34px;

    padding: 55px 50px;

    text-align: center;
    backdrop-filter: blur(12px);
}

.home-logo {
    margin: 0 auto 24px;
}

.home-panel h1 {
    font-size: clamp(30px, 5vw, 49px);
    letter-spacing: -2px;
    margin: 0 0 18px;
}

.home-panel h1 span {
    color: var(--primary);
}

.home-description {
    max-width: 720px;
    margin: 0 auto 35px;

    font-size: 15px;
    line-height: 1.85;
    color: #727286;
}

.dimension-mini {
    max-width: 570px;
    margin: 28px auto;

    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 9px;
}

.dimension-mini > div {
    background: #f6f6fb;
    border-radius: 14px;
    padding: 12px 6px;

    font-size: 12px;
    color: #69697c;
}

.dimension-mini b {
    display: block;
    font-size: 14px;
    margin-bottom: 3px;
    color: var(--text);
}

.home-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;

    gap: 18px;
    max-width: 650px;

    margin: 35px auto 0;
}

.start-btn {
    border: 0;
    border-radius: 22px;

    padding: 24px 20px;

    font-size: 20px;
    font-weight: 800;

    cursor: pointer;

    transition:
        transform .2s ease,
        box-shadow .2s ease;
}

.start-btn:hover {
    transform: translateY(-3px);
}

.start-btn.interest {
    color: #d94e71;
    background: var(--interest-soft);
}

.start-btn.aptitude {
    color: #3973c6;
    background: var(--aptitude-soft);
}

.start-btn .icon {
    display: block;
    font-size: 31px;
    margin-bottom: 8px;
}

.previous-results {
    margin-top: 26px;
}

.previous-results button {
    border: none;
    background: transparent;
    color: var(--primary);

    font-weight: 700;
    cursor: pointer;

    padding: 5px 10px;
}


/* =========================================================
   검사
========================================================= */

#testScreen {
    flex-direction: column;
}

.test-header {
    width: 100%;
    background: rgba(255,255,255,.88);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid #ededf3;
}

.test-header-inner {
    width: min(900px, calc(100% - 30px));
    height: 76px;

    margin: auto;

    display: flex;
    align-items: center;
    justify-content: space-between;
}

.test-title {
    display: flex;
    align-items: center;
    gap: 12px;
}

.test-title-badge {
    background: var(--primary-soft);
    color: var(--primary);

    padding: 7px 12px;
    border-radius: 30px;

    font-size: 13px;
    font-weight: 800;
}

.test-title strong {
    font-size: 17px;
}

.exit-btn {
    border: none;
    background: #f1f1f7;
    color: #77778a;

    padding: 9px 13px;
    border-radius: 12px;

    cursor: pointer;
}

.progress-area {
    width: min(900px, calc(100% - 30px));
    margin: 19px auto 0;
}

.progress-info {
    display: flex;
    justify-content: space-between;

    margin-bottom: 8px;

    font-size: 13px;
    color: var(--sub);
}

.progress-info b {
    color: var(--primary);
}

.progress-track {
    width: 100%;
    height: 8px;

    background: #e7e7ee;
    border-radius: 50px;
    overflow: hidden;
}

.progress-bar {
    height: 100%;
    width: 0;

    background:
        linear-gradient(90deg, #6c63ff, #918cff);

    border-radius: inherit;

    transition: width .35s ease;
}

.test-body {
    flex: 1;

    width: min(900px, calc(100% - 30px));
    margin: 0 auto;

    padding: 22px 0 30px;

    display: flex;
    flex-direction: column;
    align-items: center;
}

.instruction {
    font-size: 15px;
    color: var(--sub);

    margin: 0 0 13px;

    text-align: center;
}

.instruction strong {
    color: var(--text);
}


/* =========================================================
   메인 카드
========================================================= */

.game-card-wrap {
    width: min(385px, 100%);
    position: relative;
    perspective: 1000px;
}

.game-card {
    position: relative;

    width: 100%;

    background: white;
    border-radius: 25px;

    overflow: hidden;

    box-shadow:
        0 22px 50px rgba(35,35,70,.13);

    border: 1px solid rgba(70,70,100,.07);

    transition:
        transform .20s ease,
        opacity .20s ease;
}

.game-card.card-out {
    transform: translateX(-32px) rotate(-2deg);
    opacity: 0;
}

.card-image-box {
    position: relative;

    width: 100%;
    aspect-ratio: 3 / 4;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #fafafd;
}

.card-image-box img {
    display: block;
    width: 100%;
    height: 100%;

    object-fit: contain;

    opacity: 1;
    transition: opacity .15s ease;
}

.card-image-box img.loading-image {
    opacity: .12;
}


/* =========================================================
   로딩 오버레이
========================================================= */

.card-loading {
    position: absolute;
    inset: 0;

    z-index: 10;

    background: rgba(250,250,253,.90);

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    gap: 14px;

    color: #77778b;

    font-size: 13px;
    font-weight: 700;
}

.loading-spinner {
    width: 38px;
    height: 38px;

    border-radius: 50%;

    border: 4px solid #e3e2f0;
    border-top-color: var(--primary);

    animation: spin .7s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}


.image-error {
    display: none;

    padding: 30px;
    text-align: center;

    color: #999;
    line-height: 1.7;
}


.card-bottom {
    padding: 15px 18px 17px;

    display: flex;
    justify-content: space-between;
    align-items: center;
}

.card-number {
    font-size: 12px;
    color: #aaa;
}

.card-name {
    font-size: 17px;
    font-weight: 800;
}


/* =========================================================
   선택 버튼
========================================================= */

.choice-buttons {
    width: min(590px, 100%);

    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 11px;

    margin-top: 20px;
}

.choice-btn {
    border: none;
    border-radius: 17px;

    min-height: 62px;

    font-size: 16px;
    font-weight: 800;

    cursor: pointer;

    transition:
        transform .15s ease,
        filter .15s ease,
        opacity .15s ease;
}

.choice-btn:hover:not(:disabled) {
    transform: translateY(-2px);
}

.choice-btn.good {
    background: #eaf8f2;
    color: #328766;
}

.choice-btn.normal {
    background: #fff6e7;
    color: #d4871c;
}

.choice-btn.bad {
    background: #fff0f0;
    color: #d95757;
}


/*
   매우 중요:
   이미지 로딩 / 카드 이동 중에는
   버튼 자체를 비활성화한다.
*/

.choice-btn:disabled {
    opacity: .38;
    cursor: not-allowed;
    transform: none;
    filter: grayscale(.3);
    pointer-events: none;
}

.keyboard-help {
    margin-top: 13px;
    font-size: 11px;
    color: #aaa;
}


/* =========================================================
   최종 9장 선택
========================================================= */

#selectionScreen {
    align-items: flex-start;
    padding: 35px 0 60px;
}

.selection-panel {
    background: rgba(255,255,255,.93);
    border-radius: 30px;
    box-shadow: var(--shadow);

    padding: 35px;

    width: 100%;
}

.selection-header {
    text-align: center;
    margin-bottom: 28px;
}

.selection-header h2 {
    margin: 0 0 10px;
    font-size: 29px;
}

.selection-header p {
    margin: 0;
    color: var(--sub);
    line-height: 1.65;
}

.selection-counter {
    display: inline-block;

    margin-top: 15px;

    background: var(--primary-soft);
    color: var(--primary);

    border-radius: 30px;

    padding: 9px 17px;
    font-weight: 900;
}

.selected-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 14px;
}

.mini-card {
    position: relative;

    background: #fff;
    border-radius: 17px;
    overflow: hidden;

    border: 2px solid transparent;

    box-shadow:
        0 7px 20px rgba(30,30,60,.08);

    cursor: pointer;

    transition:
        transform .15s ease,
        border-color .15s ease;
}

.mini-card:hover {
    transform: translateY(-3px);
    border-color: #ff8ba3;
}

.mini-card img {
    width: 100%;
    aspect-ratio: 3 / 4;

    object-fit: contain;
    display: block;

    background: #fafafa;
}

.mini-card-title {
    padding: 9px 5px 11px;
    text-align: center;

    font-size: 12px;
    font-weight: 800;
}

.remove-label {
    position: absolute;
    right: 7px;
    top: 7px;

    width: 25px;
    height: 25px;

    border-radius: 50%;

    display: grid;
    place-items: center;

    background: rgba(30,30,40,.72);
    color: white;

    font-size: 14px;

    z-index: 3;
}

.added-badge {
    position: absolute;
    left: 7px;
    top: 7px;

    background: #ffb84d;
    color: white;

    padding: 5px 7px;
    border-radius: 8px;

    font-size: 9px;
    font-weight: 800;

    z-index: 3;
}

.selection-actions {
    display: flex;
    justify-content: center;
    gap: 12px;

    margin-top: 30px;
}

.primary-btn,
.secondary-btn {
    border: none;
    border-radius: 16px;

    padding: 15px 25px;

    font-size: 15px;
    font-weight: 800;

    cursor: pointer;
}

.primary-btn {
    background: var(--primary);
    color: white;

    box-shadow:
        0 10px 24px rgba(108,99,255,.22);
}

.primary-btn:disabled {
    opacity: .35;
    cursor: default;
}

.secondary-btn {
    background: #eeeef5;
    color: #66667a;
}


/* =========================================================
   분석
========================================================= */

#analysisScreen {
    justify-content: center;
    align-items: center;

    text-align: center;

    padding: 30px;
}

.analysis-box {
    width: min(500px, 100%);

    background: rgba(255,255,255,.92);
    border-radius: 32px;

    padding: 55px 30px;

    box-shadow: var(--shadow);
}

.card-stack-animation {
    position: relative;

    height: 170px;
    width: 145px;

    margin: 0 auto 30px;
}

.fake-card {
    position: absolute;

    width: 112px;
    height: 150px;

    top: 5px;
    left: 16px;

    border-radius: 16px;

    background:
        linear-gradient(135deg, #ffffff, #eeeefe);

    border: 1px solid #deddec;

    box-shadow:
        0 10px 25px rgba(50,50,90,.1);
}

.fake-card:nth-child(1) {
    animation: cardScan1 1.4s infinite ease-in-out;
}

.fake-card:nth-child(2) {
    transform: rotate(8deg);
    animation: cardScan2 1.4s infinite ease-in-out;
}

.fake-card:nth-child(3) {
    transform: rotate(-8deg);
    animation: cardScan3 1.4s infinite ease-in-out;
}

.fake-card:nth-child(4) {
    transform: rotate(3deg);
}

.fake-card-symbol {
    height: 100%;

    display: grid;
    place-items: center;

    font-size: 44px;
}

@keyframes cardScan1 {
    0%,100% {
        transform: translateX(0) rotate(0);
    }

    50% {
        transform: translateX(-25px) rotate(-8deg);
    }
}

@keyframes cardScan2 {
    0%,100% {
        transform: translateX(0) rotate(8deg);
    }

    50% {
        transform: translateX(28px) rotate(14deg);
    }
}

@keyframes cardScan3 {
    0%,100% {
        transform: translateY(0) rotate(-8deg);
    }

    50% {
        transform: translateY(-15px) rotate(-3deg);
    }
}

.analysis-box h2 {
    font-size: 28px;
    margin: 0 0 9px;
}

.analysis-message {
    min-height: 25px;

    font-size: 14px;
    color: var(--sub);
}

.analysis-progress {
    height: 8px;
    background: #ededf4;

    overflow: hidden;

    border-radius: 50px;

    margin-top: 25px;
}

.analysis-progress > div {
    height: 100%;
    width: 0;

    background:
        linear-gradient(90deg, #6c63ff, #ff7c9b);

    transition: width .5s linear;
}


/* =========================================================
   결과
========================================================= */

#resultScreen {
    align-items: flex-start;
    padding: 35px 0 70px;
}

.result-page {
    width: min(1000px, calc(100% - 30px));
    margin: auto;
}

.result-top {
    background:
        linear-gradient(135deg, #6e67e9, #8a7cee);

    color: white;

    padding: 38px;
    border-radius: 30px;

    box-shadow:
        0 20px 40px rgba(70,60,170,.20);

    position: relative;
    overflow: hidden;
}

.result-top::after {
    content: "";

    position: absolute;

    width: 220px;
    height: 220px;

    border-radius: 50%;

    background: rgba(255,255,255,.09);

    right: -60px;
    top: -90px;
}

.result-type-label {
    font-size: 13px;
    font-weight: 800;

    opacity: .85;
}

.result-top h1 {
    margin: 9px 0 10px;

    font-size: clamp(29px, 5vw, 44px);
}

.result-top p {
    margin: 0;

    max-width: 720px;

    line-height: 1.7;
    opacity: .92;
}

.result-section {
    background: white;

    margin-top: 20px;
    border-radius: 24px;

    padding: 30px;

    box-shadow:
        0 12px 30px rgba(40,40,80,.07);
}

.result-section h2 {
    margin: 0 0 20px;
    font-size: 22px;
}

.result-section h3 {
    margin: 25px 0 10px;
}

.domain-bars {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.domain-row {
    display: grid;
    grid-template-columns: 105px 1fr 52px;

    align-items: center;
    gap: 12px;
}

.domain-name {
    font-size: 14px;
    font-weight: 800;
}

.domain-track {
    height: 13px;

    border-radius: 40px;
    background: #ededf3;

    overflow: hidden;
}

.domain-value {
    height: 100%;
    width: 0;

    border-radius: inherit;

    transition: width 1s ease;
}

.domain-score {
    text-align: right;
    font-size: 13px;
    font-weight: 800;
}

.result-grid-two {
    display: grid;
    grid-template-columns: 1fr 1fr;

    gap: 20px;
}

.info-card {
    background: #f8f8fc;
    border-radius: 18px;

    padding: 22px;
}

.info-card h3 {
    margin: 0 0 12px;
    font-size: 17px;
}

.info-card p {
    font-size: 14px;
    color: #666679;

    line-height: 1.75;
    margin: 0;
}

.tag-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.tag {
    padding: 9px 12px;
    border-radius: 30px;

    background: #f1f0ff;
    color: #5e56c7;

    font-size: 13px;
    font-weight: 700;
}


/* =========================================================
   결과 - 선택 카드 영역별 그룹
========================================================= */

.domain-card-section {
    margin-top: 20px;

    border-radius: 22px;

    padding: 20px;

    background: #fafafd;

    border: 1px solid #eeeeF4;
}

.domain-card-section:first-child {
    margin-top: 0;
}

.domain-card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 15px;

    gap: 10px;
}

.domain-card-title {
    display: flex;
    align-items: center;
    gap: 9px;

    font-size: 18px;
    font-weight: 900;
}

.domain-card-count {
    border-radius: 30px;

    padding: 6px 11px;

    color: white;

    font-size: 12px;
    font-weight: 900;
}

.grouped-card-grid {
    display: grid;

    grid-template-columns:
        repeat(auto-fill, minmax(115px, 1fr));

    gap: 12px;
}

.final-card {
    position: relative;

    background: white;

    border-radius: 15px;

    padding: 7px;

    box-shadow:
        0 6px 18px rgba(30,30,60,.06);

    border: 1px solid #eeeef3;
}

.final-card img {
    width: 100%;
    aspect-ratio: 3/4;

    object-fit: contain;

    background: #fafafa;

    border-radius: 10px;
}

.final-card span.card-title {
    display: block;

    text-align: center;

    font-size: 11px;
    font-weight: 800;

    padding: 7px 2px 3px;
}

.card-domain-badge {
    position: absolute;

    left: 12px;
    top: 12px;

    z-index: 3;

    border-radius: 30px;

    padding: 5px 8px;

    color: white;

    font-size: 10px;
    font-weight: 900;

    box-shadow:
        0 3px 10px rgba(0,0,0,.12);
}

.empty-domain {
    font-size: 13px;
    color: #aaa;

    padding: 8px 0;
}


/* =========================================================
   기타 결과
========================================================= */

.result-notice {
    margin-top: 17px;

    font-size: 12px;
    line-height: 1.7;

    color: #9999aa;
}

.result-actions {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;

    gap: 10px;

    margin-top: 25px;
}


/* =========================================================
   토스트
========================================================= */

.toast {
    position: fixed;

    left: 50%;
    bottom: 25px;

    transform:
        translate(-50%, 30px);

    background: rgba(32,32,45,.92);
    color: white;

    padding: 12px 19px;

    border-radius: 40px;

    font-size: 13px;

    opacity: 0;
    pointer-events: none;

    transition: .3s;

    z-index: 999;
}

.toast.show {
    opacity: 1;

    transform:
        translate(-50%, 0);
}


/* =========================================================
   모바일
========================================================= */

@media (max-width: 760px) {

    #homeScreen {
        padding: 20px 0;
    }

    .home-panel {
        padding: 35px 20px;
        border-radius: 26px;
    }

    .home-buttons {
        grid-template-columns: 1fr;
        gap: 12px;
    }

    .dimension-mini {
        grid-template-columns: repeat(2,1fr);
    }

    .test-header-inner {
        height: 65px;
    }

    .test-title strong {
        font-size: 14px;
    }

    .game-card-wrap {
        width: min(310px, 82vw);
    }

    .test-body {
        padding-top: 13px;
    }

    .choice-buttons {
        position: sticky;
        bottom: 8px;

        padding: 7px;

        background: rgba(247,247,252,.9);
        backdrop-filter: blur(8px);

        border-radius: 20px;

        z-index: 20;
    }

    .choice-btn {
        min-height: 58px;

        font-size: 14px;

        padding: 8px 3px;
    }

    .keyboard-help {
        display: none;
    }

    .selection-panel {
        padding: 25px 15px;
    }

    .selected-grid {
        grid-template-columns: repeat(3,1fr);
        gap: 9px;
    }

    .result-section {
        padding: 22px 18px;
    }

function showScreen(screenId) {

    document
        .querySelectorAll(".screen")
        .forEach(screen => {

            screen.classList.remove(
                "active"
            );

        });


    document
        .getElementById(screenId)
        .classList.add("active");


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


function shuffle(array) {

    const copy = [...array];


    for (
        let i = copy.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );


        [
            copy[i],
            copy[j]
        ] = [
            copy[j],
            copy[i]
        ];
    }


    return copy;
}


function toast(message) {

    const el =
        document.getElementById("toast");


    el.textContent =
        message;


    el.classList.add("show");


    setTimeout(() => {

        el.classList.remove("show");

    }, 1800);
}

            `이 활동을 내가
             <strong>얼마나 좋아하는지</strong>
             생각해 보세요.`;

            .getElementById("positiveButton")
            .innerHTML =
            "❤️ 좋아함";

            .getElementById("negativeButton")
            .innerHTML =
            "🙅 싫어함";

    }

    else {

        document
            .getElementById("testBadge")
            .textContent =
            "⭐ 적성 검사";


        document
            .getElementById("questionGuide")
            .innerHTML =

            `이 활동을 내가
             <strong>얼마나 잘하는지</strong>
             생각해 보세요.`;


        document
            .getElementById("positiveButton")
            .innerHTML =
            "⭐ 잘함";


        document
            .getElementById("negativeButton")
            .innerHTML =

    }


    showScreen(
        "testScreen"
    );


    renderCard();
}


/* =========================================================
   카드 출력

   핵심 변경:
   이미지가 실제 로드된 뒤에만 버튼 활성화
========================================================= */

function renderCard() {

    if (
        currentIndex >=
        shuffledCards.length
    ) {

        finishCardQuestions();

        return;
    }


    /*
       새 카드 시작 시
       무조건 버튼 잠금
    */

    setChoiceButtonsEnabled(false);


    const card =
        shuffledCards[currentIndex];


    document
        .getElementById("cardNumber")
        .textContent =
        `${card.number} / 52`;


    document
        .getElementById("cardName")
        .textContent =
        card.name;


    const img =
        document.getElementById(
            "cardImage"
        );


    const error =
        document.getElementById(
            "imageError"
        );


    const loading =
        document.getElementById(
            "cardLoading"
        );


    /*
       로딩번호 증가
    */

    imageLoadToken++;

    const thisToken =
        imageLoadToken;


    /*
       초기 상태
    */

    loading.style.display =
        "flex";

    error.style.display =
        "none";

    img.style.display =
        "block";

    img.classList.add(
        "loading-image"
    );


    /*
       이미지가 정상 로드된 경우
    */

    img.onload = () => {

        /*
           현재 카드가 아니라
           이전 카드 이미지의 이벤트라면 무시
        */

        if (
            thisToken !==
            imageLoadToken
        ) {
            return;
        }


        loading.style.display =
            "none";


        img.classList.remove(
            "loading-image"
        );


        /*
           이 시점에서만
           버튼 활성화
        */

        setChoiceButtonsEnabled(true);


        /*
           다음 카드 미리 불러오기
        */

        preloadNextCard();

    };


    /*
       이미지 오류
    */

    img.onerror = () => {

        if (
            thisToken !==
            imageLoadToken
        ) {
            return;
        }


        loading.style.display =
            "none";


        img.style.display =
            "none";


        error.style.display =
            "block";


        error.innerHTML =

            `<b>
                ${card.number}.
                ${card.name}
             </b>

             <br><br>

             카드 이미지를 찾지 못했습니다.

             <br>

             cards/${card.file}

             <br><br>

             이미지 없이도 선택은 가능합니다.`;


        /*
           이미지 오류가 나더라도
           검사는 계속할 수 있도록 버튼 활성화
        */

        setChoiceButtonsEnabled(true);

    };


    /*
       이미지 지정
    */

    img.src =
        "cards/" +
        card.file;


    /*
       진행률
    */

    const percentage =

        (currentIndex / 52)
        * 100;


    document
        .getElementById(
            "progressBar"
        )
        .style.width =
        `${percentage}%`;


    document
        .getElementById(
            "progressText"
        )
        .textContent =
        `${currentIndex + 1} / 52`;
}


/* =========================================================
   다음 카드 프리로드

   사용자가 현재 카드를 보는 동안
   다음 이미지를 미리 브라우저 캐시에 넣음
========================================================= */

function preloadNextCard() {

    const nextIndex =
        currentIndex + 1;


    if (
        nextIndex >=
        shuffledCards.length
    ) {
        return;
    }


    const next =
        shuffledCards[nextIndex];


    const preloadImage =
        new Image();


    preloadImage.src =
        "cards/" +
        next.file;
}


/* =========================================================
   카드 선택
========================================================= */

function answerCard(answer) {

    /*
       이미지 로딩중 또는
       이미 선택된 상태면 무시
    */

    if (cardLocked) {
        return;
    }


    if (
        currentIndex >= 52
    ) {
        return;
    }


    /*
       클릭한 즉시 잠금
    */

    setChoiceButtonsEnabled(false);


    const card =
        shuffledCards[currentIndex];


    answers[answer].push(card);


    const gameCard =
        document.getElementById(
            "gameCard"
        );


    gameCard.classList.add(
        "card-out"
    );


    /*
       카드 이동 애니메이션 후
       다음 카드로 이동
    */

    setTimeout(() => {

        currentIndex++;


        gameCard.classList.remove(
            "card-out"
        );


        renderCard();

    }, 200);
}


/* =========================================================
   검사 완료
========================================================= */

function finishCardQuestions() {

    setChoiceButtonsEnabled(false);


    document
        .getElementById(
            "progressBar"
        )
        .style.width =
        "100%";


    /*
       좋아함 / 잘함 카드
    */

    selectionPool =
        answers.positive.map(card => ({

            ...card,

            addedFromNeutral: false

        }));


    /*
       9장 미만이면
       보통에서 보충
    */

    if (
        selectionPool.length < 9
    ) {

        const needed =
            9 -
            selectionPool.length;


        const neutralShuffled =
            shuffle(
                answers.neutral
            );


        const additional =
            neutralShuffled
                .slice(0, needed)
                .map(card => ({

                    ...card,

                    addedFromNeutral: true

                }));


        selectionPool.push(
            ...additional
        );


        /*
           보통까지 넣어도
           9장이 안 되는 매우 특수한 경우
        */

        if (
            selectionPool.length < 9
        ) {

            alert(

                "핵심 카드 9장을 만들 수 없습니다.\n\n'좋아함/잘함' 또는 '보통' 카드를 조금 더 선택하여 다시 검사해주세요."

            );


            restartCurrentTest();

            return;
        }
    }


    selectedFinalCards =
        [...selectionPool];


    showSelectionScreen();
}


/* =========================================================
   최종 카드 선택 화면
========================================================= */

/* =========================================================
   최종 카드 렌더링
========================================================= */

function renderSelectionCards() {

    const grid =
        document.getElementById(
            "selectedGrid"
        );


    grid.innerHTML = "";


    selectionPool.forEach(card => {

        const selected =
            selectedFinalCards.some(
                selectedCard =>
                    selectedCard.id ===
                    card.id
            );


        const div =
            document.createElement(
                "div"
            );


        div.className =
            "mini-card";


        if (!selected) {

            div.style.opacity =
                ".32";

            div.style.filter =
                "grayscale(1)";
        }


        div.innerHTML = `

            ${
                card.addedFromNeutral
                ?
                `
                <div class="added-badge">
                    보통에서 보충
                </div>
                `
                :
                ""
            }

            ${
                selected &&
                selectionPool.length > 9
                ?
                `
                <div class="remove-label">
                    ×
                </div>
                `
                :
                ""
            }

            <img
                src="cards/${card.file}"
                alt="${card.name}">

            <div class="mini-card-title">
                ${card.name}
            </div>

        `;


        if (
            selectionPool.length > 9
        ) {

            div.onclick = () => {

                toggleFinalCard(
                    card.id
                );

            };
        }


        grid.appendChild(div);
    });


    const count =
        selectedFinalCards.length;


    document
        .getElementById(
            "selectionCounter"
        )
        .textContent =
        `${count} / 9`;


    const analyzeButton =
        document.getElementById(
            "analyzeButton"
        );


    analyzeButton.disabled =
        count !== 9;


    analyzeButton.textContent =
        count === 9
        ?
        "9장 분석하기"
        :
        `${9 - count}장 더 선택하세요`;
}


/* =========================================================
   카드 제외 / 복구
========================================================= */

function toggleFinalCard(id) {

    const exists =
        selectedFinalCards.some(
            card =>
                card.id === id
        );


    if (exists) {

        selectedFinalCards =
            selectedFinalCards.filter(
                card =>
                    card.id !== id
            );

    }

    else {

        if (
            selectedFinalCards.length >= 9
        ) {

            toast(
                "이미 9장을 선택했습니다."
            );

            return;
        }


        const card =
            selectionPool.find(
                card =>
                    card.id === id
            );


        selectedFinalCards.push(card);
    }


    renderSelectionCards();
}


/* =========================================================
   분석
========================================================= */

function beginAnalysis() {

    if (
        selectedFinalCards.length !== 9
    ) {

        toast(
            "카드를 정확히 9장 선택해주세요."
        );

        return;
    }


    showScreen(
        "analysisScreen"
    );


    const bar =
        document.getElementById(
            "analysisProgressBar"
        );


    const message =
        document.getElementById(
            "analysisMessage"
        );


    bar.style.width =
        "0%";


    const messages = [

        "선택한 카드의 공통점을 찾고 있어요.",

        "사물·사람·자료·아이디어 영역을 비교하고 있어요.",

        currentTest === "interest"
            ?
            "흥미가 나타나는 활동 패턴을 분석하고 있어요."
            :
            "강점이 나타나는 활동 패턴을 분석하고 있어요.",

        "선택한 카드의 특징을 정리하고 있어요.",

        "결과를 완성하고 있어요!"

    ];


    message.textContent =
        messages[0];


    let step = 0;


    setTimeout(() => {

        bar.style.width =
            "20%";

    }, 100);


    const interval =
        setInterval(() => {

            step++;


            bar.style.width =
                `${Math.min(
                    (step + 1) * 20,
                    100
                )}%`;


            if (
                messages[step]
            ) {

                message.textContent =
                    messages[step];
            }


            if (
                step >= 4
            ) {

                clearInterval(
                    interval
                );

            }

        }, 1000);


    setTimeout(() => {

        calculateAndShowResult();

    }, 5100);
}


/* =========================================================
   점수 계산
========================================================= */

function calculateScores(cards) {

    const scores = {

        things: 0,
        people: 0,
        data: 0,
        ideas: 0

    };


    cards.forEach(card => {

        scores[
            card.domain
        ]++;

    });


    return scores;
}


/* =========================================================
   성향 조합
========================================================= */

            aptitude:
                "구체적인 대상을 다루면서 자료를 분석하고 오류를 찾아내는 방식에 강점이 있을 수 있습니다."

        },


        "data-people": {

            interest:
                "사람과 관련된 문제를 자료와 정보를 이용해 해결하는 활동에 관심이 있는 조합입니다.",

            aptitude:
                "사람의 요구를 이해하면서 자료와 근거를 이용해 판단하는 능력이 강점이 될 수 있습니다."
        },

            interest:

        }

    };


    if (
        combinations[pair]
    ) {

        return combinations[pair][
            testType
        ];
    }


    return "";
}


/* =========================================================
   결과 계산
========================================================= */

function calculateAndShowResult() {

    const scores =
        calculateScores(
            selectedFinalCards
        );


    const ranking =
        Object.entries(scores)
        .sort(
            (a,b) =>
                b[1] - a[1]
        );


    const result = {

        type:
            currentTest,

        cards:
            selectedFinalCards,

        scores,

        ranking,

        date:
            new Date()
                .toISOString()

    };


    if (
        currentTest ===
        "interest"
    ) {

        localStorage.setItem(

            "predigerInterestResult",

            JSON.stringify(
                result
            )

        );

    }

    else {

        localStorage.setItem(

            "predigerAptitudeResult",

            JSON.stringify(
                result
            )

        );
    }


    renderResult(result);


    showScreen(
        "resultScreen"
    );
}

    /*
       결과 막대 애니메이션
    */

    setTimeout(() => {

        document
            .querySelectorAll(

            )

}


/* =========================================================
   결과 - 선택 카드 영역별 그룹화

   이번 수정의 핵심
========================================================= */

function makeGroupedCardResult(cards) {

    const domainOrder = [
        "things",
        "people",
        "data",
        "ideas"
    ];


    return domainOrder
        .map(domainKey => {

            const domain =
                domainInfo[
                    domainKey
                ];


            /*
               현재 영역의 카드만 추출
            */

            const domainCards =
                cards.filter(
                    card =>
                        card.domain ===
                        domainKey
                );


            return `

                <div
                    class="domain-card-section"
                    style="
                        border-left:
                        5px solid
                        ${domain.color};
                    ">

                    <div class="domain-card-header">

                        <div class="domain-card-title">

                            ${domain.icon}

                            ${domain.korean}

                            <span
                                style="
                                    font-size:11px;
                                    color:#999;
                                    font-weight:700;
                                ">

                                ${domain.english}

                            </span>

                        </div>


                        <div
                            class="domain-card-count"
                            style="
                                background:
                                ${domain.color};
                            ">

                            ${domainCards.length}장

                        </div>

                    </div>


                    ${
                        domainCards.length > 0
                        ?
                        `

                        <div class="grouped-card-grid">

                            ${
                                domainCards
                                .map(card => `

                                    <div class="final-card">

                                        <div
                                            class="card-domain-badge"
                                            style="
                                                background:
                                                ${domain.color};
                                            ">

                                            ${domain.icon}

                                            ${domain.korean}

                                        </div>


                                        <img
                                            src="cards/${card.file}"
                                            alt="${card.name}">


                                        <span class="card-title">

                                            ${card.number}.

                                            ${card.name}

                                        </span>

                                    </div>

                                `)
                                .join("")
                            }

                        </div>

                        `
                        :
                        `

                        <div class="empty-domain">

                            이 영역에서 선택한 카드는 없습니다.

                        </div>

                        `
                    }

                </div>

            `;

        })
        .join("");
}


/* =========================================================
   막대그래프
========================================================= */

function makeDomainBar(
    key,
    count
) {

    const domain =
        domainInfo[key];


    const percent =
        (count / 9)
        * 100;


    return `

        <div class="domain-row">

            <div class="domain-name">

                ${domain.icon}

                ${domain.korean}

            </div>


            <div class="domain-track">

                <div
                    class="domain-value"
                    data-width="${percent}%"
                    style="
                        width:0;
                        background:
                        ${domain.color};
                    ">
                </div>

            </div>


            <div class="domain-score">
                ${count}장
            </div>

        </div>

    `;
}

/* =========================================================
   중복 제거
========================================================= */

function uniqueArray(array) {

    return [
        ...new Set(array)
    ];
}


/* =========================================================
   재시작
========================================================= */

function restartCurrentTest() {

    if (!currentTest) {

        goHome();

        return;
    }


    startTest(
        currentTest
    );
}


/* =========================================================
   나가기
========================================================= */

function confirmExit() {

    const result =
        confirm(

            "검사를 종료하고 메인 화면으로 돌아갈까요?\n현재 진행 내용은 저장되지 않습니다."

        );


    if (result) {

        goHome();
    }
}


function goHome() {

    /*
       로딩 중이던 이미지 이벤트 무효화
    */

    imageLoadToken++;


    currentTest =
        null;


    setChoiceButtonsEnabled(
        false
    );


    showScreen(
        "homeScreen"
    );


    updatePreviousResults();
}


/* =========================================================
   이전 결과
========================================================= */

function updatePreviousResults() {

    const area =
        document.getElementById(
            "previousResults"
        );


    const interest =
        localStorage.getItem(
            "predigerInterestResult"
        );


    const aptitude =
        localStorage.getItem(
            "predigerAptitudeResult"
        );


    let html =
        "";


    if (
        interest ||
        aptitude
    ) {

        html += `

            <div
                class="small"
                style="margin-bottom:5px">

                저장된 검사 결과

            </div>

        `;
    }


    if (interest) {

        html += `

            <button
                onclick="loadStoredResult('interest')">

                ❤️ 이전 흥미 결과 보기

            </button>

        `;
    }


    if (aptitude) {

        html += `

            <button
                onclick="loadStoredResult('aptitude')">

                ⭐ 이전 적성 결과 보기

            </button>

        `;
    }


    area.innerHTML =
        html;
}


/* =========================================================
   이전 결과 불러오기
========================================================= */

function loadStoredResult(type) {

    const key =
        type === "interest"
        ?
        "predigerInterestResult"
        :
        "predigerAptitudeResult";


    const stored =
        localStorage.getItem(
            key
        );


    if (!stored) {

        toast(
            "저장된 결과가 없습니다."
        );

        return;
    }


    try {

        const result =
            JSON.parse(
                stored
            );


        renderResult(
            result
        );


        showScreen(
            "resultScreen"
        );

    }

    catch (error) {

        console.error(
            error
        );


        toast(
            "결과를 불러오지 못했습니다."
        );
    }
}


/* =========================================================
   키보드

   버튼이 활성 상태일 때만 작동
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        const testScreen =
            document.getElementById(
                "testScreen"
            );


        if (
            !testScreen
                .classList
                .contains("active")
        ) {

            return;
        }


        /*
           로딩중이면 키보드도 무시
        */

        if (cardLocked) {
            return;
        }


        if (
            event.key ===
            "ArrowLeft"
        ) {

            event.preventDefault();

            answerCard(
                "positive"
            );

        }

        else if (
            event.key ===
            "ArrowDown"
        ) {

            event.preventDefault();

            answerCard(
                "neutral"
            );

        }

        else if (
            event.key ===
            "ArrowRight"
        ) {

            event.preventDefault();

            answerCard(
                "negative"
            );

        }

    }
);


/* =========================================================
   초기화
========================================================= */

setChoiceButtonsEnabled(
    false
);


updatePreviousResults();

</script>
